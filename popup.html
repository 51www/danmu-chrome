<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>幕伴</title>
    <style>
      :root {
        --paper: #f4f7e9;
        --panel: #fdfdf6;
        --ink: #3b4a2f;
        --muted: #7a8a68;
        --line: #dce5c8;
        --accent: #5d8a3a;
        --accent-deep: #456c2b;
        --accent-soft: #eaf2d9;
        --gold: #e8ad35;
        --gold-deep: #d79a20;
        --danger: #b4653f;
        --stage: #2c3a24;
        --stage-line: #4b5d3a;
        --stage-text: #b8c9a4;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        width: 380px;
        background:
          radial-gradient(120px 80px at 8% -10%, rgba(232, 173, 53, 0.16), transparent 70%),
          radial-gradient(180px 120px at 100% 0%, rgba(93, 138, 58, 0.16), transparent 70%),
          linear-gradient(160deg, #f9faf0 0%, var(--paper) 58%, #edf3dc 100%);
        color: var(--ink);
        font: 13px/1.5 var(--sans);
      }
      :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px;
        background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(253,253,246,0.72));
        border-bottom: 1px solid var(--line);
        box-shadow: 0 2px 10px rgba(69, 108, 43, 0.06);
      }
      .brand { display: flex; align-items: center; gap: 8px; }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 9px 9px 9px 2px;
        background: linear-gradient(145deg, #7fa64c, var(--accent-deep));
        color: #fffdf2;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 2px 6px rgba(69, 108, 43, 0.22);
      }
      header h1 { margin: 0; font-size: 13px; font-weight: 650; color: var(--accent-deep); }
      .tabs { display: flex; gap: 4px; }
      .tab {
        border: 1px solid transparent;
        border-radius: 999px;
        background: none;
        color: var(--muted);
        padding: 4px 11px;
        font: 11px var(--mono);
        letter-spacing: 0.04em;
      }
      .tab:hover { color: var(--accent-deep); }
      .tab[aria-selected="true"] {
        color: var(--accent-deep);
        border-color: var(--line);
        background: var(--accent-soft);
      }

      #panelDanmu { padding: 14px; }
      #panelSettings { max-height: 520px; overflow-y: auto; padding: 12px 14px 16px; }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(69, 108, 43, 0.06);
        overflow: hidden;
        margin-bottom: 14px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        padding: 7px 11px;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child { border-bottom: 0; }
      .row .label {
        color: var(--muted);
        flex-shrink: 0;
        font: 10px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding-top: 2px;
      }
      .row .value { color: var(--ink); text-align: right; word-break: break-all; }
      .tag {
        display: inline-block;
        padding: 1px 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        font: 10px var(--mono);
        color: var(--muted);
      }
      .tag.ok { border-color: #b7d08e; background: var(--accent-soft); color: var(--accent-deep); }
      .tag.no { border-color: #e4c3ad; background: #fbefe6; color: var(--danger); }

      label {
        display: block;
        font: 10px var(--mono);
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .search { display: flex; gap: 6px; }
      input, textarea {
        flex: 1;
        min-width: 0;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fffef8;
        color: var(--ink);
        font: 13px var(--sans);
        outline: none;
      }
      textarea { font: 11px/1.5 var(--mono); resize: vertical; min-height: 48px; }
      input::placeholder, textarea::placeholder { color: #9aa98a; }
      input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(93, 138, 58, 0.12); }

      button {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        color: var(--ink);
        padding: 7px 11px;
        font: 12px var(--sans);
        cursor: pointer;
        transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
      }
      button:hover { border-color: var(--accent); background: var(--accent-soft); }
      button:active { transform: translateY(1px); }
      button.primary {
        background: linear-gradient(180deg, #f2c25a, var(--gold));
        border-color: var(--gold-deep);
        color: #4a3a12;
        font-weight: 600;
        border-radius: 999px;
        box-shadow: 0 3px 8px rgba(215, 154, 32, 0.24);
      }
      button.primary:hover { background: linear-gradient(180deg, #f7cd70, var(--gold-deep)); }
      button.secondary { background: var(--panel); color: var(--accent-deep); }
      button.danger { background: #fff7f1; color: var(--danger); border-color: #e4c3ad; }
      button.danger:hover { background: #fbe9dd; border-color: var(--danger); }
      button.link { border: 0; padding: 0 2px; background: none; color: var(--accent); font-size: 11px; box-shadow: none; }
      button.link:hover { background: none; text-decoration: underline; }
      button.link.danger { color: var(--danger); }
      .btn-icon { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
      .btn-icon svg { width: 13px; height: 13px; flex: none; }
      .actions { display: flex; gap: 6px; margin-top: 8px; }
      .actions button { flex: 1; white-space: nowrap; }

      #results { margin-top: 12px; max-height: 230px; overflow: auto; padding-right: 2px; }
      .group-title {
        font: 10px var(--mono);
        color: var(--accent-deep);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--line);
        padding-bottom: 5px;
        margin: 10px 0 7px;
      }
      .result-item {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 9px;
        margin-bottom: 5px;
        padding: 8px 10px;
        font-size: 12px;
        line-height: 1.4;
      }
      .result-item:hover { background: var(--accent-soft); border-color: #b7d08e; }

      #message {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font: 11px/1.5 var(--mono);
        color: var(--muted);
        margin-top: 10px;
        padding: 8px 10px;
        background: #f2f5e8;
        border: 1px solid var(--line);
        border-radius: 10px;
        transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
      }
      #message:empty { display: none; }
      #message::before {
        content: "·";
        flex: none;
        width: 15px; height: 15px;
        display: grid; place-items: center;
        border-radius: 50%;
        background: #e3e9d5;
        color: #7a8a68;
        font: 700 11px/1 var(--sans);
      }
      #message.loading { background: #fbf1d8; border-color: #ecd39a; color: #8a6412; }
      #message.loading::before {
        content: ""; background: transparent; box-sizing: border-box;
        border: 2px solid #e0c07a; border-top-color: var(--gold-deep);
        animation: notice-spin .7s linear infinite;
      }
      #message.success { background: #e9f3d7; border-color: #b7d08e; color: var(--accent-deep); }
      #message.success::before { content: "✓"; background: var(--accent); color: #fffdf6; }
      #message.error { background: #fbe9dd; border-color: #e4c3ad; color: var(--danger); }
      #message.error::before { content: "!"; background: var(--danger); color: #fffdf6; }
      @keyframes notice-spin { to { transform: rotate(360deg); } }
      .tip {
        font-size: 11px;
        color: #6f7f5e;
        margin-top: 12px;
        padding: 10px 11px;
        background: linear-gradient(180deg, #f6f9e9, #f0f5df);
        border: 1px solid var(--line);
        border-radius: 10px;
        line-height: 1.6;
      }

      /* 关键词流程轨道：采集 → 确定 → 装填。阶段切换只动 transform / opacity。 */
      .flow {
        margin-bottom: 12px;
        padding: 11px 13px 10px;
        background: linear-gradient(180deg, #f0f6df, #fbfcf5);
        border: 1px solid #c9d9a8;
        border-radius: 12px;
        box-shadow: 0 5px 16px rgba(69, 108, 43, 0.09);
        transition: background 240ms ease, border-color 240ms ease;
      }
      .flow[data-stage="collect"] { background: linear-gradient(180deg, #fbf1d8, #fffdf4); border-color: #ecd39a; }
      .flow[data-stage="loaded"] { background: linear-gradient(180deg, #dfeed0, #f6fbee); border-color: #a9c982; }
      .flow__steps { position: relative; display: flex; justify-content: space-between; }
      .flow__rail {
        position: absolute; left: 12px; right: 12px; top: 12px;
        height: 4px; background: #dce5c8; border-radius: 999px; overflow: hidden;
      }
      .flow__progress {
        display: block; width: 100%; height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--gold));
        transform: scaleX(0); transform-origin: left center;
        transition: transform 340ms cubic-bezier(.22, .7, .24, 1);
      }
      .flow[data-stage="resolved"] .flow__progress { transform: scaleX(.5); }
      .flow[data-stage="loaded"] .flow__progress { transform: scaleX(1); }
      .flow__step {
        position: relative; z-index: 1;
        flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
      }
      .flow__step:first-of-type { align-items: flex-start; }
      .flow__step:last-of-type { align-items: flex-end; }
      .flow__dot {
        position: relative; width: 24px; height: 24px; border-radius: 50%;
        background: var(--panel); border: 2px solid #c9d9a8;
        display: grid; place-items: center;
        transition: background 200ms ease, border-color 200ms ease, transform 220ms cubic-bezier(.34, 1.56, .64, 1);
      }
      .flow__pulse, .flow__check {
        position: absolute; display: block; opacity: 0;
        transition: opacity 180ms ease, transform 220ms cubic-bezier(.34, 1.56, .64, 1);
      }
      .flow__pulse { inset: -3px; border: 2px solid var(--accent); border-radius: 50%; }
      .flow__check {
        width: 9px; height: 5px; margin-top: -2px;
        border-left: 2px solid #fffdf6; border-bottom: 2px solid #fffdf6;
        transform: rotate(-45deg) scale(.3);
      }
      .flow__step--active .flow__dot {
        background: var(--accent); border-color: var(--accent-deep);
        transform: scale(1.12);
        box-shadow: 0 0 0 4px rgba(93, 138, 58, 0.16);
      }
      .flow__step--active .flow__pulse { opacity: 1; animation: flow-pulse 1.5s ease-out infinite; }
      .flow__step--done .flow__dot { background: var(--accent); border-color: var(--accent); }
      .flow__step--done .flow__check { opacity: 1; transform: rotate(-45deg) scale(1); }
      .flow[data-stage="resolved"] .flow__step--active .flow__dot {
        background: var(--gold); border-color: var(--gold-deep);
        box-shadow: 0 0 0 4px rgba(232, 173, 53, 0.2);
      }
      .flow[data-stage="resolved"] .flow__step--active .flow__pulse { border-color: var(--gold-deep); }
      .flow__label { font: 11px var(--mono); letter-spacing: .04em; color: #8b9c76; }
      .flow__step--active .flow__label { color: var(--accent-deep); font-weight: 700; }
      .flow__step--done .flow__label { color: var(--accent-deep); font-weight: 600; }
      .flow__detail {
        display: flex; align-items: flex-start; gap: 7px;
        margin-top: 10px; padding: 7px 9px;
        min-height: 17px; font: 11px/1.5 var(--mono);
        color: var(--muted);
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(220, 229, 200, 0.85);
        border-radius: 9px;
      }
      .flow__detail::before {
        content: "·"; flex: none;
        width: 15px; height: 15px; display: grid; place-items: center;
        border-radius: 50%; background: #e3e9d5; color: #7a8a68;
        font: 700 11px/1 var(--sans);
      }
      .flow[data-stage="collect"] .flow__detail { color: #8a6412; }
      .flow[data-stage="collect"] .flow__detail::before {
        content: ""; box-sizing: border-box;
        background: transparent; border: 2px solid #e0c07a; border-top-color: var(--gold-deep);
        animation: notice-spin .7s linear infinite;
      }
      .flow[data-stage="resolved"] .flow__detail { color: #8a6412; }
      .flow[data-stage="resolved"] .flow__detail::before { content: "✓"; background: var(--gold); color: #4a3a12; }
      .flow[data-stage="loaded"] .flow__detail { color: var(--accent-deep); font-weight: 600; }
      .flow[data-stage="loaded"] .flow__detail::before { content: "✓"; background: var(--accent); color: #fffdf6; }
      @keyframes flow-pulse {
        0% { transform: scale(.9); opacity: .9; }
        100% { transform: scale(2.3); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow__pulse { animation: none !important; opacity: 0 !important; }
        .flow__detail::before, #message::before { animation: none !important; }
        .flow, .flow__progress, .flow__dot, .flow__pulse, .flow__check { transition: none !important; }
      }

      /* 设置视图：预览区保持深色模拟视频画面，控件沿用奶油绿主色。 */
      .preview-stage {
        background: var(--stage);
        border: 1px solid #3f5233;
        border-radius: 12px;
        padding: 10px 11px 11px;
        margin-bottom: 16px;
        box-shadow: 0 6px 18px rgba(44, 58, 36, 0.18);
      }
      .preview-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font: 10px var(--mono);
        letter-spacing: 0.06em;
        color: var(--stage-text);
        margin-bottom: 7px;
      }
      .preview-track {
        position: relative;
        height: 64px;
        overflow: hidden;
        border: 1px solid var(--stage-line);
        border-radius: 8px;
        background: linear-gradient(180deg, #34422a, #222d1d);
      }
      .preview-danmu {
        position: absolute;
        left: 100%;
        white-space: nowrap;
        line-height: 1.1;
        font-size: var(--pv-size, 25px);
        color: var(--pv-color, #ffffff);
        opacity: var(--pv-opacity, 0.9);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
        animation: pv-scroll var(--pv-speed, 8s) linear infinite;
      }
      .preview-danmu--a { top: 5px; }
      .preview-danmu--b { top: 35px; animation-delay: -4s; }
      @keyframes pv-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(calc(-100% - 390px)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .preview-danmu { animation: none; left: 8px; }
      }

      .settings-section { margin-bottom: 16px; }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-bottom: 5px;
        margin-bottom: 9px;
        border-bottom: 1px solid var(--line);
      }
      .section-head h2 {
        margin: 0;
        font: 10px var(--mono);
        letter-spacing: 0.1em;
        color: var(--accent-deep);
        text-transform: uppercase;
      }
      .section-head .hint { font: 10px var(--mono); color: var(--muted); }
      .field { margin-bottom: 9px; }
      .field:last-child { margin-bottom: 0; }
      .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
      .field-grid .field { margin-bottom: 0; }
      .field-grid .field-wide { grid-column: 1 / -1; }
      .color-row, .range-row { display: flex; align-items: center; gap: 7px; }
      input[type="color"] { flex: 0 0 34px; width: 34px; height: 33px; padding: 2px; border-radius: 9px; }
      .range-row input[type="range"] { flex: 1; padding: 0; accent-color: var(--accent); }
      .range-value { flex: 0 0 32px; text-align: right; font: 11px var(--mono); color: var(--muted); }

      .rule-card { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; margin-bottom: 6px; overflow: hidden; }
      .rule-head { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; }
      .rule-main { flex: 1; min-width: 0; }
      .rule-title { display: block; font-size: 12px; font-weight: 600; color: var(--ink); text-transform: none; letter-spacing: 0; margin-bottom: 1px; }
      .rule-pattern { display: block; font: 10px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .rule-head input[type="checkbox"] { flex: 0 0 14px; width: 14px; height: 14px; margin: 2px 0 0; accent-color: var(--accent); }
      .rule-form { border-top: 1px dashed var(--line); padding: 9px; display: grid; gap: 9px; }
      .rule-form .field { margin: 0; }
      .checks { display: flex; flex-wrap: wrap; gap: 12px; }
      .check { display: inline-flex; align-items: center; gap: 5px; font: 11px var(--sans); color: var(--ink); text-transform: none; letter-spacing: 0; margin: 0; }
      .check input { flex: 0 0 14px; width: 14px; height: 14px; accent-color: var(--accent); }
      .rule-form-actions { display: flex; justify-content: flex-end; gap: 6px; }
      .rule-empty { padding: 12px; text-align: center; font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; background: rgba(255,255,255,0.5); }

      .settings-foot { display: flex; align-items: center; gap: 10px; padding-top: 9px; border-top: 1px solid var(--line); }
      #configStatus { flex: 1; font: 10px/1.5 var(--mono); color: var(--muted); }
      #configStatus.ok { color: var(--accent-deep); }
      #configStatus.err { color: var(--danger); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fffdf2" stroke-width="2.2" stroke-linecap="round">
            <path d="M4 7h9M4 12h15M4 17h7" />
          </svg>
        </span>
        <h1>幕伴</h1>
      </div>
      <div class="tabs" role="tablist" aria-label="幕伴功能">
        <button class="tab" id="tabDanmu" role="tab" aria-selected="true" aria-controls="panelDanmu">弹幕</button>
        <button class="tab" id="tabSettings" role="tab" aria-selected="false" aria-controls="panelSettings">设置</button>
      </div>
    </header>

    <section id="panelDanmu" role="tabpanel" aria-labelledby="tabDanmu">
      <div class="card">
        <div class="row"><span class="label">清单规则</span><span class="value" id="ruleName">-</span></div>
        <div class="row"><span class="label">视频标题</span><span class="value" id="title">-</span></div>
        <div class="row"><span class="label">当前剧集</span><span class="value" id="episode">-</span></div>
        <div class="row"><span class="label">装填进度</span><span class="value" id="wizardState">-</span></div>
        <div class="row"><span class="label">弹幕条数</span><span class="value" id="count">0</span></div>
        <div class="row"><span class="label">装填方式</span><span class="value" id="matchSource">-</span></div>
      </div>

      <div class="flow" id="flow" data-stage="idle" role="status" aria-live="polite">
        <div class="flow__steps">
          <div class="flow__rail"><span class="flow__progress"></span></div>
          <span class="flow__step" id="flowStep1">
            <span class="flow__dot"><i class="flow__pulse"></i><i class="flow__check"></i></span>
            <span class="flow__label">采集</span>
          </span>
          <span class="flow__step" id="flowStep2">
            <span class="flow__dot"><i class="flow__pulse"></i><i class="flow__check"></i></span>
            <span class="flow__label">确定</span>
          </span>
          <span class="flow__step" id="flowStep3">
            <span class="flow__dot"><i class="flow__pulse"></i><i class="flow__check"></i></span>
            <span class="flow__label">装填</span>
          </span>
        </div>
        <div class="flow__detail" id="flowDetail">等待匹配</div>
      </div>

      <label for="keyword">弹幕搜索关键字</label>
      <div class="search">
        <input id="keyword" list="keywordOptions" placeholder="输入影片名称，或点自动匹配后从下拉选择" autocomplete="off" />
        <datalist id="keywordOptions"></datalist>
        <button id="searchBtn" class="primary btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="6" /><path d="m16 16 4 4" />
          </svg>搜索
        </button>
      </div>

      <div class="actions">
        <button class="primary btn-icon" id="autoMatchBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2" />
          </svg>自动匹配
        </button>
        <button class="danger btn-icon" id="clearBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5" />
          </svg>清除弹幕
        </button>
      </div>
      <div class="actions">
        <button class="secondary btn-icon" id="addCurrentSite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="8" /><path d="M12 8v8M8 12h8" />
          </svg>+ 当前网站
        </button>
      </div>

      <div id="results"></div>
      <div id="message"></div>
      <div class="tip">已开启自动匹配的站点：打开视频会自动匹配标题并弹出选择窗口，先选弹幕作品、再选目标集数后才会装填；未选完可随时取消。未匹配到时可点提示中的「手动选择」自行搜索，也可在下方手动装填。</div>
    </section>

    <section id="panelSettings" role="tabpanel" aria-labelledby="tabSettings" hidden>
      <div class="preview-stage" aria-label="弹幕样式实时预览">
        <div class="preview-head"><span>实时预览</span><span>修改下方选项即时更新</span></div>
        <div class="preview-track" id="previewTrack">
          <span class="preview-danmu preview-danmu--a">实时预览 · 第 12 集</span>
          <span class="preview-danmu preview-danmu--b">字号 / 颜色 / 速度即时更新</span>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-head"><h2>弹幕服务</h2><span class="hint">API / 缓存</span></div>
        <div class="field">
          <label for="setApiBase">API 地址（含鉴权参数）</label>
          <input id="setApiBase" type="url" placeholder="https://api.example.com?token=..." spellcheck="false" />
        </div>
        <div class="field">
          <label for="setCacheTTL">缓存时长（毫秒）</label>
          <input id="setCacheTTL" type="number" min="0" step="1000" />
        </div>
      </div>

      <div class="settings-section">
        <div class="section-head"><h2>弹幕外观</h2><span class="hint">即时生效</span></div>
        <div class="field-grid">
          <div class="field">
            <label for="setFontSize">字号</label>
            <input id="setFontSize" type="number" min="12" max="60" />
          </div>
          <div class="field">
            <label for="setColorText">颜色</label>
            <div class="color-row">
              <input id="setColor" type="color" aria-label="选择弹幕颜色" />
              <input id="setColorText" type="text" spellcheck="false" aria-label="弹幕颜色值" />
            </div>
          </div>
          <div class="field">
            <label for="setSpeed">滚动时长（秒）</label>
            <input id="setSpeed" type="number" min="3" max="30" />
          </div>
          <div class="field">
            <label for="setMaxLines">最大行数</label>
            <input id="setMaxLines" type="number" min="1" max="30" />
          </div>
          <div class="field field-wide">
            <label for="setOpacity">透明度</label>
            <div class="range-row">
              <input id="setOpacity" type="range" min="0.1" max="1" step="0.05" />
              <span class="range-value" id="opacityValue">0.9</span>
            </div>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-head">
          <h2>站点规则</h2>
          <button class="link" id="addRuleInline">+ 新增规则</button>
        </div>
        <div id="ruleList"></div>
        <div id="ruleEditor" hidden>
          <div class="rule-form">
            <div class="field-grid">
              <div class="field">
                <label for="ruleNameField">名称</label>
                <input id="ruleNameField" type="text" />
              </div>
              <div class="field">
                <label for="ruleIdField">ID（留空自动生成）</label>
                <input id="ruleIdField" type="text" spellcheck="false" />
              </div>
            </div>
            <div class="field">
              <label for="rulePatternsField">网址模式（每行一条）</label>
              <textarea id="rulePatternsField" spellcheck="false"></textarea>
            </div>
            <div class="field">
              <label for="ruleSelectorsField">标题选择器（每行一条，按优先级）</label>
              <textarea id="ruleSelectorsField" spellcheck="false"></textarea>
            </div>
            <div class="checks">
              <span class="check"><input id="ruleEnabledField" type="checkbox" /> 启用</span>
              <span class="check"><input id="ruleAutoFillField" type="checkbox" /> 自动填关键字</span>
              <span class="check"><input id="ruleAutoLoadField" type="checkbox" /> 自动装填</span>
            </div>
            <div class="rule-form-actions">
              <button id="cancelRule">取消</button>
              <button id="saveRuleInline" class="primary">保存规则</button>
            </div>
          </div>
        </div>
      </div>

      <div class="settings-foot">
        <button class="link danger" id="resetConfig">恢复默认</button>
        <span id="configStatus" role="status" aria-live="polite"></span>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
